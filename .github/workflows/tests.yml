# CI for a TPU kernel, running on free CPU runners.
#
# This works because of two things in the package:
#
#   1. `tests.py --stage lower` runs the REAL Mosaic lowering under an abstract TPU
#      mesh (layout.abstract_tpu_mesh). No TPU is involved, but block-shape rules and
#      missing primitive lowerings are caught for real: 40 configs across chunk
#      128/256/512/1024, bf16/f32, v5e and v3.
#   2. Every other stage runs in Pallas interpret mode, which simulates VMEM/DMA on
#      CPU. Slow (~1000x) but numerically correct, so parity against the references
#      is checked here too.
#
# What CI cannot check is throughput. Performance numbers have to be measured on a real
# v5e-8 by hand.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  lower:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Mosaic lowering, v5e + v3, all chunk sizes
        run: python -m mamba3_pallas.tests --stage lower

  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[torch,train]"
      - name: References, rotation, forward, backward, segments, torch parity
        run: |
          python -m mamba3_pallas.tests \
            --stage shapes --stage refs --stage rotation \
            --stage forward --stage backward --stage segments --stage torch

  slow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[torch,train]"
      - run: python -m mamba3_pallas.tests --stage decode --stage train

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check mamba3_pallas
